<h3>Cek lingkungan</h3>
<pre id="env"></pre>
<script>
const lines=[];
lines.push('Secure context (HTTPS/localhost): '+(window.isSecureContext?'ya':'TIDAK'));
const hasCam=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
lines.push('navigator.mediaDevices.getUserMedia: '+(hasCam?'tersedia':'TIDAK tersedia'));
lines.push('Alamat: '+location.href);
lines.push('Browser: '+navigator.userAgent);
document.getElementById('env').textContent=lines.join('\n');
</script>
